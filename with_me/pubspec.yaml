  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # Both faces are provisional - the design document names no fonts, so these
  # were identified from the renders. See docs/WITH_ME_SPEC_V1.md. Quicksand is
  # shipped as static instances cut from the upstream variable font.
  fonts:
    - family: Quicksand
      fonts:
        - asset: assets/fonts/Quicksand-400.ttf
          weight: 400
        - asset: assets/fonts/Quicksand-500.ttf
          weight: 500
        - asset: assets/fonts/Quicksand-600.ttf
          weight: 600
        - asset: assets/fonts/Quicksand-700.ttf
          weight: 700
    - family: Yellowtail
