<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.url != '/' %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="icon" href="{{ '/assets/icon.png' | relative_url }}">
  <style>
    :root {
      --teal: #23918F;
      --teal-dark: #0E6E70;
      --ink: #14504E;
      --cream: #FFF9EE;
      --sand: #F6EAD6;
      --card: #FFFFFF;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
      color: var(--ink);
      background: var(--cream);
      line-height: 1.6;
      font-size: 17px;
    }
    header {
      background: linear-gradient(160deg, var(--teal), var(--teal-dark));
      color: #fff;
      text-align: center;
      padding: 28px 16px 22px;
    }
    header a.home { color: inherit; text-decoration: none; display: inline-flex; align-items: center; gap: 12px; }
    header img { width: 56px; height: 56px; border-radius: 14px; }
    header .name { font-size: 30px; font-weight: 700; letter-spacing: .3px; }
    header .tagline { margin: 6px 0 16px; opacity: .92; }
    nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
    nav a {
      color: #fff;
      text-decoration: none;
      border: 1.5px solid rgba(255, 255, 255, .7);
      border-radius: 999px;
      padding: 7px 16px;
      font-size: 15px;
      font-weight: 600;
    }
    nav a:hover, nav a.here { background: #fff; color: var(--teal-dark); }
    main { max-width: 760px; margin: 0 auto; padding: 24px 16px 40px; }
    main h1 { font-size: 28px; margin: 8px 0 12px; }
    main h2 {
      font-size: 20px;
      margin: 28px 0 8px;
      color: var(--teal-dark);
    }
    main a { color: var(--teal-dark); }
    main a, main p { overflow-wrap: anywhere; }
    .card {
      background: var(--card);
      border-radius: 18px;
      padding: 18px 20px;
      margin: 14px 0;
      box-shadow: 0 2px 10px rgba(20, 80, 78, .08);
    }
    .card > :first-child { margin-top: 0; }
    .card > :last-child { margin-bottom: 0; }
    .card ul { padding-left: 1.2em; }
    .buttons { display: flex; flex-wrap: wrap; gap: 10px; margin: 18px 0 6px; }
    .button {
      display: inline-block;
      background: var(--teal);
      color: #fff !important;
      text-decoration: none;
      border-radius: 999px;
      padding: 10px 20px;
      font-weight: 700;
    }
    .button.light { background: #fff; color: var(--teal-dark) !important; border: 1.5px solid var(--teal); }
    footer {
      text-align: center;
      font-size: 14px;
      padding: 20px 16px 32px;
      background: var(--sand);
    }
    footer a { color: var(--teal-dark); }
  </style>
</head>
<body>
  <header>
    <a class="home" href="{{ '/' | relative_url }}">
      <img src="{{ '/assets/icon.png' | relative_url }}" alt="">
      <span class="name">{{ site.title }}</span>
    </a>
    <div class="tagline">{{ site.description }}</div>
    <nav>
      <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="here"{% endif %}>Home</a>
      <a href="{{ '/privacy/' | relative_url }}"{% if page.url == '/privacy/' %} class="here"{% endif %}>Privacy Policy</a>
      <a href="{{ '/terms/' | relative_url }}"{% if page.url == '/terms/' %} class="here"{% endif %}>Terms of Use</a>
      <a href="{{ '/delete-account/' | relative_url }}"{% if page.url == '/delete-account/' %} class="here"{% endif %}>Delete your account</a>
    </nav>
  </header>
  <main>
    {{ content }}
  </main>
  <footer>
    With Me by HR Vision Consulting.
    Questions: <a href="mailto:hrrhvisionconsulting@gmail.com">hrrhvisionconsulting@gmail.com</a>
  </footer>
</body>
</html>
